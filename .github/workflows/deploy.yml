name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-lab-blind-hello
    steps:
      - name: Checkout this lab
        uses: actions/checkout@v4
        with:
          path: crypto-lab-blind-hello

      # This lab CONSUMES the fleet's HPKE implementation from the hub repo —
      # it must sit next to this checkout exactly as it does in local dev.
      - name: Checkout the HPKE hub (crypto-lab-hpke-envelope)
        uses: actions/checkout@v4
        with:
          repository: systemslibrarian/crypto-lab-hpke-envelope
          path: crypto-lab-hpke-envelope

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crypto-lab-blind-hello/package-lock.json

      - name: Install hub dependencies (the hub's @noble packages resolve from its own tree)
        run: npm ci
        working-directory: crypto-lab-hpke-envelope

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test (RFC 9180 KATs through the hub + ECH construction gates)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crypto-lab-blind-hello/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
